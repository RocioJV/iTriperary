<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Trip - iTriperary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="top-navbar">
        <div class="navbar-left">iTriperary</div>
        <div class="navbar-right">
            <a href="#" id="login-btn">log in</a>
            <span>|</span>
            <a href="#" id="signup-btn">sign up</a>
        </div>
    </header>

    <nav class="pill-navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="create-trip.html" class="active">Create Trip</a></li>
            <li><a href="#">My Trips</a></li>
            <li><a href="#">About Us</a></li>
        </ul>
    </nav>

    <div class="create-trip-container">
        <div class="trip-options">
            <button class="trip-option-btn active" id="createTripBtn">
                <i class="fas fa-plus-circle"></i>
                Create New Trip
            </button>
            <button class="trip-option-btn" id="joinTripBtn">
                <i class="fas fa-users"></i>
                Join Existing Trip
            </button>
        </div>

        <div class="trip-form-container" id="createTripForm">
            <h2>Create Your Trip</h2>
            <form class="trip-form">
                <div class="form-group">
                    <label for="tripName">Trip Name</label>
                    <input type="text" id="tripName" name="tripName" placeholder="Enter your trip name" required>
                </div>

                <div class="form-group">
                    <label for="destination">Destination</label>
                    <div class="destination-input">
                        <input type="text" id="destination" name="destination" placeholder="Search for a destination" required>
                        <i class="fas fa-search"></i>
                    </div>
                </div>

                <div class="form-group date-range">
                    <div class="date-input">
                        <label for="startDate">Start Date</label>
                        <input type="text" id="startDate" name="startDate" placeholder="Select start date" required>
                    </div>
                    <div class="date-input">
                        <label for="endDate">End Date</label>
                        <input type="text" id="endDate" name="endDate" placeholder="Select end date" required>
                    </div>
                </div>

                <button type="submit" class="create-trip-btn">
                    <i class="fas fa-plane-departure"></i>
                    Create Trip
                </button>
            </form>
        </div>

        <div class="trip-form-container hidden" id="joinTripForm">
            <h2>Join a Trip</h2>
            <form class="trip-form">
                <div class="form-group">
                    <label for="tripCode">Trip Code</label>
                    <input type="text" id="tripCode" name="tripCode" placeholder="Enter trip code" required>
                </div>
                <button type="submit" class="join-trip-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Join Trip
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="create-trip.js"></script>
</body>
</html>
